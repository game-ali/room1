  /* ===== Ceiling Fan CSS ===== */
.fan {
  position: relative;
  width: 220px;       /* overall size */
  height: 220px;
  margin: auto;
  display: grid;
  place-items: center;
  animation: spin 1s linear infinite; /* rotation speed */
}

.hub {
  position: relative;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle at 40% 35%, #4a4f58, #2b2f36 70%);
  border-radius: 50%;
  box-shadow:
    inset 0 6px 12px rgba(255,255,255,.08),
    inset 0 -10px 16px rgba(0,0,0,.25);
}

.hub::after {
  content: "";
  position: absolute;
  inset: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #2a2e35, #1c1f24);
  box-shadow: 0 0 0 2px rgba(0,0,0,.25);
}

/* Blades */
.blade {
  position: absolute;
  width: 110px;       /* length of blade */
  height: 22px;       /* thickness of blade */
  left: 50%;
  top: 50%;
  transform-origin: 0% 50%;
  background: linear-gradient(90deg, #4f5560 0%, #60656f 45%, #727883 100%);
  border-radius: 10px 60px 60px 10px;
  box-shadow:
    inset 0 4px 6px rgba(255,255,255,.06),
    inset 0 -6px 10px rgba(0,0,0,.18);
}

/* Position blades at 0, 90, 180, 270 degrees */
.blade:nth-child(2) { transform: translate(-50%, -50%) rotate(90deg); }
.blade:nth-child(3) { transform: translate(-50%, -50%) rotate(180deg); }
.blade:nth-child(4) { transform: translate(-50%, -50%) rotate(270deg); }
.blade:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }

@keyframes spin {
  to { transform: rotate(360deg); }
}
/* ===== Ceiling Light CSS ===== */
.ceiling-light {
  position: relative;
  width: 120px;
  height: 160px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* Rod */
.ceiling-light::before {
  content: "";
  position: absolute;
  top: -60px;
  width: 6px;
  height: 60px;
  background: #555;
  border-radius: 3px;
}

/* Lamp body */
.lamp {
  position: relative;
  width: 100px;
  height: 100px;
  background: #444;
  border-radius: 50% 50% 60% 60%;
  box-shadow: inset 0 -10px 20px rgba(0,0,0,.3);
}

/* Light glow */
.glow {
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    rgba(255,255,255,0.8) 0%,
    rgba(255,255,255,0.2) 40%,
    transparent 70%);
  animation: colorChange 6s linear infinite;
  filter: blur(20px);
}

/* Color changing animation */
@keyframes colorChange {
  0%   { background: radial-gradient(circle, rgba(255,0,0,0.7), transparent 70%); }
  25%  { background: radial-gradient(circle, rgba(0,255,0,0.7), transparent 70%); }
  50%  { background: radial-gradient(circle, rgba(0,0,255,0.7), transparent 70%); }
  75%  { background: radial-gradient(circle, rgba(255,255,0,0.7), transparent 70%); }
  100% { background: radial-gradient(circle, rgba(255,0,255,0.7), transparent 70%); }
}
/* ===== Cabinet with Buttons ===== */
.cabinet {
  position: absolute;
  left: 40px;              /* stick to left side of room */
  top: 50%;
  transform: translateY(-50%) perspective(800px) rotateY(25deg);
  width: 180px;
  height: 300px;
  background: #3a3f47;
  border: 4px solid #222;
  border-radius: 6px;
  box-shadow: -8px 12px 20px rgba(0,0,0,0.4);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 50px;
  gap: 12px;
  padding: 16px;
}

/* Buttons inside cabinet */
.cabinet .button {
  background: linear-gradient(#555, #333);
  border-radius: 50%;
  box-shadow:
    inset -2px -4px 6px rgba(0,0,0,0.5),
    inset 2px 4px 6px rgba(255,255,255,0.1),
    0 4px 6px rgba(0,0,0,0.4);
  transition: transform 0.2s ease, background 0.3s ease;
}

/* Press effect */
.cabinet .button:active {
  transform: scale(0.9);
  background: linear-gradient(#222, #111);
}
