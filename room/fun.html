<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CSS Ceiling Fan</title>
<style>
  :root {
    --bg: #f5f7fa;
    --rod: #8a8f98;
    --hub: #3c4047;
    --blade: #60656f;
    --accent: #2b2f36;
    --fan-size: 220px;       /* diameter of blades */
    --blade-width: 24px;     /* thickness of each blade */
    --speed: 1.2s;           /* rotation speed (lower = faster) */
  }

  body {
    height: 100vh;
    margin: 0;
    background: radial-gradient(1200px at 50% -200px, #e9edf3 0%, var(--bg) 60%);
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
  }

  /* Ceiling mount and rod */
  .ceiling {
    position: relative;
    width: 12px;
    height: 140px;
  }
  .mount {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 62px;
    height: 10px;
    background: linear-gradient(#777, #999);
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .rod {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 120px;
    background: linear-gradient(var(--rod), #9aa0a8);
    border-radius: 3px;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,.12);
  }

  /* Fan hub and blades */
  .fan {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: var(--fan-size);
    height: var(--fan-size);
    display: grid;
    place-items: center;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.18));
    animation: spin var(--speed) linear infinite;
  }

  .hub {
    position: relative;
    width: 86px;
    height: 86px;
    background: radial-gradient(circle at 40% 35%, #4a4f58, var(--hub) 70%);
    border-radius: 50%;
    box-shadow:
      inset 0 6px 12px rgba(255,255,255,.08),
      inset 0 -10px 16px rgba(0,0,0,.25);
  }

  .hub::after {
    content: "";
    position: absolute;
    inset: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #2a2e35, var(--accent));
    box-shadow: 0 0 0 2px rgba(0,0,0,.25);
  }

  /* Four blades */
  .blade {
    position: absolute;
    width: calc(var(--fan-size) / 2);
    height: var(--blade-width);
    left: 50%;
    top: 50%;
    transform-origin: 0% 50%;
    background:
      linear-gradient(90deg, #4f5560 0%, var(--blade) 45%, #727883 100%);
    border-radius: 10px 60px 60px 10px;
    box-shadow:
      inset 0 4px 6px rgba(255,255,255,.06),
      inset 0 -6px 10px rgba(0,0,0,.18);
  }

  /* Place blades at 0, 90, 180, 270 degrees */
  .blade:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
  .blade:nth-child(2) { transform: translate(-50%, -50%) rotate(90deg); }
  .blade:nth-child(3) { transform: translate(-50%, -50%) rotate(180deg); }
  .blade:nth-child(4) { transform: translate(-50%, -50%) rotate(270deg); }

  /* Optional wobble for realism */
  .fan {
    animation: spin var(--speed) linear infinite, wobble 3.5s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: translateX(-50%) rotate(360deg); }
  }

  @keyframes wobble {
    0%, 100% { filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
    50% { filter: drop-shadow(0 12px 18px rgba(0,0,0,.22)); }
  }

  /* Speed controls demo */
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 8px 12px;
    background: #1f2937;
    color: #fff;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="ceiling">
    <div class="mount"></div>
    <div class="rod"></div>

    <div class="fan">
      <div class="hub"></div>
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="blade"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="document.documentElement.style.setProperty('--speed','2.5s')">Low</button>
    <button class="btn" onclick="document.documentElement.style.setProperty('--speed','1.2s')">Medium</button>
    <button class="btn" onclick="document.documentElement.style.setProperty('--speed','0.6s')">High</button>
  </div>
</body>
</html>
